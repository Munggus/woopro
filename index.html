<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#D92F5E"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="우프로 운동해"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>html,body{margin:0}</style></head><body><title>우프로 운동해</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-screen phone app. Four tabs (루틴, 운동, 기록, 설정) over a scrolling column; a full-screen overlay runs the workout (plan, set/countdown, summary). */
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--surface2:#E7EBEF;--ink:#121A22;--ink2:#58646F;--line:#D8DEE4;
  --work:#D92F5E;--rest:#0B8069;--prep:#A56A00;--at:#C4254F;--bar:#BAC4CE;--star:#E5A100;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161D;--surface:#18222C;--surface2:#243140;--ink:#EEF2F5;--ink2:#9DAAB6;--line:#2B3844;--at:#FF7A9C;--bar:#3A4A5A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161D;--surface:#18222C;--surface2:#243140;--ink:#EEF2F5;--ink2:#9DAAB6;--line:#2B3844;--at:#FF7A9C;--bar:#3A4A5A;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--at);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:22px;font-weight:900;text-wrap:balance}
h2{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink2);margin-bottom:8px}

#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#view{max-width:600px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
#tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{flex:1;min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--ink2);font-size:12px;font-weight:500}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--at);font-weight:700}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{min-width:0}
.chip{background:var(--surface2);padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.hint{color:var(--ink2);font-size:14px}
.fld{display:grid;gap:6px}
.fld>span{font-weight:700;font-size:14px;color:var(--ink2)}
.fld em{font-style:normal;font-weight:400}
.fld small{color:var(--ink2);font-size:13px}
input[type=text],input[type=search],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
select{appearance:auto;min-height:48px}
textarea{resize:vertical;min-height:84px}
.back{align-self:flex-start;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--at);font-weight:700;font-size:15px}

.row{display:grid;grid-template-columns:auto 1fr 2.6em;align-items:center;gap:8px;min-height:60px}
.row+.row,.fld+.row{border-top:1px solid var(--line)}
.lab{font-weight:700}
.step{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.step button{width:48px;height:48px;border-radius:14px;border:0;background:var(--surface2);font:700 24px/1 var(--f-body)}
.step input{width:66px;height:48px;text-align:center;border:0;background:transparent;font:700 30px/1 var(--f-num);font-variant-numeric:tabular-nums;padding:0}
.unit{color:var(--ink2);font-size:14px}

.btn{width:100%;min-height:54px;border-radius:14px;border:0;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;line-height:1.25;padding:0 12px}
.btn.sm{min-height:44px;font-size:15px}
.btn small{font-weight:400;font-size:12px;opacity:.9}
.primary{background:var(--work);color:#fff}
.ghost{background:var(--surface2);color:var(--ink)}
.danger{background:transparent;color:var(--at);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta{position:sticky;bottom:0;padding-block:10px 2px;background:linear-gradient(to top,var(--bg) 72%,transparent)}

.mini{min-height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--surface2);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);white-space:nowrap}
.mini.pri{background:var(--work);color:#fff}
.empty{color:var(--ink2);font-size:15px;padding:8px 0;list-style:none}
ul.list{list-style:none;margin:0;padding:0}
.star{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.star svg{width:26px;height:26px;fill:none;stroke:var(--ink2);stroke-width:1.8;stroke-linejoin:round}
.star[aria-pressed=true] svg{fill:var(--star);stroke:var(--star)}

/* 운동 그림 */
.fg{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fh{fill:var(--surface2);stroke:var(--ink);stroke-width:4}
.eq *{stroke:var(--ink2);stroke-width:3.5;fill:none;stroke-linecap:round}
.gl{stroke:var(--line);stroke-width:2;fill:none}
.ar{fill:none;stroke:var(--ink2);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.thumb{flex:none;width:84px;height:56px;border-radius:12px;background:var(--surface2);overflow:hidden;display:grid;place-items:center}
.thumb svg,.hero svg{width:100%;height:100%;display:block}
.thumb img,.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero{aspect-ratio:2/1;max-width:100%;background:var(--surface2);border-radius:16px;overflow:hidden;display:grid;place-items:center}

/* 목록 */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.cb{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.cb[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xrow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 0;border:0;background:transparent;text-align:left;border-top:1px solid var(--line)}
li:first-child>.xrow,li:first-child.xrow2{border-top:0}
.xrow2{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.xt{flex:1;min-width:0;display:grid}
.xt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xt small{color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--ink2);font-size:22px}
.rhead{display:flex;align-items:center;gap:8px}
.rmain{flex:1;min-width:0;display:grid}
.rmain span{font-size:13px;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface2);border-radius:99px;padding:3px 10px;font-size:13px}
.ritem{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.ritem .xt{flex:1}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface2);font-size:18px;font-weight:700;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.desc{white-space:pre-line;color:var(--ink)}

/* 변화 그래프 */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:14px}
.seg button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chread{font-variant-numeric:tabular-nums;font-weight:700;min-height:1.5em}
.chsum{color:var(--ink2);font-size:14px}
.cht{width:100%;height:auto;display:block}
.cg{stroke:var(--line);stroke-width:1}
.cl{fill:none;stroke:var(--work);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cd{fill:var(--work);stroke:var(--surface);stroke-width:2}
.csel{fill:none;stroke:var(--ink);stroke-width:2}
.ct{fill:var(--ink2);font-size:11px;font-family:var(--f-body)}
.cv{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
.hit{fill:transparent;cursor:pointer}
.rec{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rec:first-child{border-top:0}
.rec span:last-child{text-align:right;font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{display:grid;text-align:center;padding:2px 4px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font:700 44px/1.05 var(--f-num);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink2)}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:150px;align-items:end}
.col{display:grid;grid-template-rows:18px 1fr 20px;height:100%;text-align:center;font-size:12px;color:var(--ink2)}
.col .val{font-variant-numeric:tabular-nums;font-weight:700}
.barwrap{display:flex;align-items:flex-end;justify-content:center}
.barwrap i{display:block;width:70%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--bar);min-height:3px}
.col.today .barwrap i{background:var(--work)}
.col.today .dow{color:var(--at);font-weight:700}
.hrow{border-top:1px solid var(--line);padding:6px 0}
.hrow:first-child{border-top:0}
.hbtn{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border:0;background:transparent;text-align:left}
.hbtn .hmain{min-width:0;display:grid}
.hbtn .hmain span{font-size:13px;color:var(--ink2)}
.hmeta{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.hdet{padding:4px 0 10px;display:grid;gap:10px}
.hdet .rec{padding:6px 0}
.hbtns{display:flex;gap:8px}

.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px}
.srow+.srow,.srow+.row,.row+.srow{border-top:1px solid var(--line)}
.srow b{display:block}.srow small{display:block;color:var(--ink2);font-size:13px}
.sw{flex:none;width:52px;height:32px;border-radius:99px;border:0;background:var(--surface2);position:relative}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked=true]{background:var(--work)}
.sw[aria-checked=true] i{transform:translateX(20px)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--work)}
#code-out{font-size:12px;word-break:break-all}

/* 운동 화면 */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;color:#fff;background:var(--phc);--phc:var(--prep);transition:background .25s;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov[data-ph=work]{--phc:var(--work)}.ov[data-ph=rest]{--phc:var(--rest)}.ov[data-ph=done]{--phc:var(--rest)}
.ov[data-ph=plan]{--phc:var(--bg);color:var(--ink)}
.ov-in{flex:1;min-height:0;display:flex;flex-direction:column;max-width:600px;width:100%;margin:0 auto}
#ro-plan,#ro-swap{overflow-y:auto;gap:14px;padding-bottom:4px}
.ov-top{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:15px;opacity:.95}
.ov-top span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-mid{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;gap:6px;padding-block:8px}
.ov-fig{width:min(72vw,280px);aspect-ratio:2/1;max-height:14vh}
.ov-fig svg,.ov-fig img{width:100%;height:100%;display:block}
.ov-fig img{object-fit:cover;border-radius:14px}
.ov-fig .fg,.ov-fig .fh,.ov-fig .eq *,.ov-fig .ar{stroke:#fff}
.ov-fig .fh{fill:none}
.ov-fig .gl{stroke:rgba(255,255,255,.35)}
.ph-label{font-weight:900;font-size:26px;letter-spacing:.04em;text-wrap:balance}
.num{font:700 clamp(110px,40vw,240px)/1 var(--f-num);font-variant-numeric:tabular-nums}
.num.sm{font-size:clamp(72px,24vw,140px)}
.num.wt{font-size:clamp(52px,16.5vw,110px);white-space:nowrap}
.num small{font-size:.32em;font-weight:600;margin-left:.08em;margin-right:.12em}
.ex{font-size:17px;font-weight:500;min-height:1.6em;text-wrap:balance;opacity:.95}
.adj{display:flex;flex-direction:column;gap:8px;align-items:center}
.adjrow{display:flex;align-items:center;justify-content:center;gap:12px}
.adjrow span{width:2.4em;font-size:14px;opacity:.9}
.adjrow b{min-width:3.6em;font:700 28px/1 var(--f-num);font-variant-numeric:tabular-nums}
.adjb{min-width:56px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.22);color:#fff;font:700 22px/1 var(--f-body);padding:0 14px}
.ov-bot{display:flex;flex-direction:column;gap:12px}
.next{text-align:center;font-size:15px;font-weight:500;opacity:.95;min-height:1.5em}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bar.thin{height:5px}
.bar i{display:block;height:100%;width:0;background:#fff}
.ctrl{display:flex;gap:10px}
.ob{flex:1;min-height:60px;border-radius:16px;border:0;background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0 10px;text-align:center;line-height:1.25}
.ob.main{flex:1.6;background:#fff;color:var(--phc);font-size:19px}
.ob.wide{flex:none;width:100%}
.dl{list-style:none;margin:6px 0 0;padding:0;width:100%;display:grid;gap:6px;text-align:left}
.dl li{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;display:grid;gap:0}
.dl small{opacity:.9;font-size:13px}
.pc-head{display:flex;align-items:center;gap:12px}
.pc-t{flex:1;min-width:0;display:grid}
.pc-t small{color:var(--ink2);font-size:13px}

/* 우프로 스티커·달력·통계 */
.mas{display:block;width:auto;max-width:88vw;object-fit:contain;flex:none;pointer-events:none;user-select:none}
.brand{display:flex;align-items:center;gap:10px}
.brand .bt{flex:1;min-width:0;display:grid}
.brand .bt small{color:var(--ink2);font-size:13px}
.emptyb{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink2);padding:8px 0;font-size:15px}
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash b{font-size:26px;font-weight:900}
#splash span{color:var(--ink2);font-size:14px}
#splash em{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-style:normal;font-size:12px;color:var(--ink2);opacity:.6}
#ro-mas{height:150px}
#ro[data-ph=rest] .ov-fig,#ro[data-ph=prep] .ov-fig{display:none}
@media (max-height:720px){.ov-fig{display:none}#ro-mas{height:104px}.num{font-size:clamp(72px,30vw,170px)}.num.sm{font-size:clamp(56px,20vw,110px)}.num.wt{font-size:clamp(44px,14vw,84px)}.ov-mid{gap:2px}}
.xl{display:flex;align-items:center;border-top:1px solid var(--line)}
.xl:first-child{border-top:0}
.xl .xrow{flex:1;min-width:0;border-top:0}
.xl .star{margin-right:-8px}
.hdr{display:flex;align-items:center;gap:6px}
.hdr h1{flex:1;min-width:0}
.rbtn{border:0;background:transparent;text-align:left;padding:0;min-height:44px;color:inherit}
.rbtn b{display:block}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calh b{font-size:18px}
.calb{width:44px;height:44px;border:0;border-radius:12px;background:var(--surface2);font:700 20px/1 var(--f-body)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cwd{text-align:center;font-size:12px;color:var(--ink2);font-weight:700;padding:2px 0}
.cwd.sun,.cday.sun .dn{color:var(--at)}
.cday{min-height:50px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cday .dn{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.cday .dots{display:flex;gap:3px;height:6px}
.cday .dots i{width:6px;height:6px;border-radius:50%;background:var(--work)}
.cday.today{box-shadow:inset 0 0 0 2px var(--line)}
.cday.today .dn{font-weight:900}
.cday.sel{background:var(--work)}
.cday.sel .dn{color:#fff}
.cday.sel .dots i{background:#fff}
.stats.sm b{font-size:30px}
.spark{width:100%;height:44px;display:block}
.spark .cl{vector-effect:non-scaling-stroke}
.rsum{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

#exitq{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#exitq .dlg{background:var(--surface);border-radius:22px;padding:20px;width:min(100%,340px);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#exitq .dlg b{font-size:19px}#exitq .dlg span{color:var(--ink2);font-size:14px}#exitq .two{width:100%;margin-top:8px}
.rec2{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:14px}
.dh{touch-action:none;cursor:grab;font-size:22px;color:var(--ink2)}
.ritem{transition:transform .12s;border-radius:12px}
.ritem.drag{position:relative;z-index:5;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#ro-swapbtn{min-height:46px;font-size:15px}

.tin{display:flex;align-items:baseline;justify-content:center;gap:2px}
.tin input{width:40px;height:48px;text-align:center;border:0;background:transparent;font:700 26px/1 var(--f-num);font-variant-numeric:tabular-nums;padding:0}
.tin small{color:var(--ink2);font-size:13px;margin-right:4px}
input[type=range]{width:100%;accent-color:var(--work);height:36px}
.ob[aria-pressed=true]{background:#fff;color:var(--phc)}
#ro-done .ob{min-height:50px}
#d-eff-wrap{display:grid;gap:6px;text-align:center}
.calb:disabled{opacity:.35}
#shq{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#shq .shd>*{flex-shrink:0}
#shq .shd{background:var(--bg);width:min(100%,520px);max-height:94vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}

function chartHtml(pts,unit,period){

  var now=Date.now(),t0=period?now-period*86400000:pts[0].t,t1=now;if(!period&&t1-t0<86400000)t0=t1-86400000;
  var X=function(t){return L+(t-t0)/(t1-t0)*pw;},Y=function(v){return T+ph-(v-lo)/(hi-lo)*ph;};
  var g='',i;
  [lo,(lo+hi)/2,hi].forEach(function(v){g+='<line class="cg" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="ct" x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+niceNum(v)+'</text>';});

function stats(){
  var keys={};S.history.forEach(function(h){keys[dayKey(h.ts)]=1;});
  var streak=0,d=new Date();d.setHours(12);if(!keys[dayKey(d)])d.setDate(d.getDate()-1);
  while(keys[dayKey(d)]){streak++;d.setDate(d.getDate()-1);}
  var week=[];
  for(var i=6;i>=0;i--){var x=new Date();x.setHours(12);x.setDate(x.getDate()-i);var k=dayKey(x);
    var en=S.history.filter(function(h){return dayKey(h.ts)===k;});
    week.push({dow:x.getDay(),today:i===0,n:en.length,sec:en.reduce(function(a,h){return a+h.seconds;},0)});}
  return {streak:streak,week:week,count:week.reduce(function(a,w){return a+w.n;},0),min:Math.round(week.reduce(function(a,w){return a+w.sec;},0)/60)};
}
function wkCard(){
  var st=stats(),mx=Math.max.apply(null,st.week.map(function(w){return w.sec;}).concat([1]));

  '<div class="chart" role="img" aria-label="최근 7일 운동 시간(분)">'+st.week.map(function(w){return '<div class="col'+(w.today?' today':'')+'"><span class="val">'+(w.sec?Math.max(1,Math.round(w.sec/60)):'')+'</span><div class="barwrap"><i style="height:'+(w.sec?Math.max(6,w.sec/mx*100):0)+'%"></i></div><span class="dow">'+DAYS[w.dow]+'</span></div>';}).join('')+'</div></section>';
}

  if(t.id==='bk-file'){var bf=t.files&&t.files[0];t.value='';if(bf){var rd=new FileReader();rd.onload=function(){codeIn=String(rd.result||'').trim();render();toast('파일을 읽었어. 아래 복원 버튼을 눌러줘');setTimeout(function(){var c=$('code-in');if(c&&c.scrollIntoView)c.scrollIntoView({block:'center'});},50);};rd.readAsText(bf);}return;}
  if(t.id==='photo-in'){var f=t.files&&t.files[0];t.value='';if(f&&nav.sub&&nav.sub.id)readPhoto(f,function(url){patchEx(nav.sub.id,{img:url});render();toast('사진을 넣었어');});return;}
  var k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='val'){if(t.dataset.k==='prep')setPrep(t.value);else if(nav.sub&&nav.sub.id)setDefVal(nav.sub.id,t.dataset.k,t.value);}
  else if(k==='pl')setPlanVal(+t.dataset.i,t.dataset.k,t.value);
  else if(k==='tm'||k==='ts'){var w=t.closest('.tin'),tot=(parseInt(w.querySelector('.tm').value,10)||0)*60+(parseInt(w.querySelector('.ts').value,10)||0);
    if(t.dataset.scope==='d'){if(nav.sub&&nav.sub.id)setDefVal(nav.sub.id,t.dataset.k,tot);}else setPlanVal(+t.dataset.i,t.dataset.k,tot);}
  else if(k==='vol'){save();beep(1000,0.25);}
  else if(k==='inchist'){incHist=t.checked;render();}
  else if(k==='incimg'){incImg=t.checked;render();}
  else if(k==='dr-cat'&&draft)draft.cat=t.value;
  else if(k==='dr-type'&&draft)draft.type=t.value;
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='fq'){flt.q=t.value;var l=$('lib-list');if(l)l.innerHTML=libRows();}
  else if(k==='rname'&&rdraft)rdraft.name=t.value.slice(0,30);
  else if(k==='codein')codeIn=t.value;
  else if(k==='vol'){S.settings.volume=+t.value;var vn=$('vol-n');if(vn)vn.textContent=t.value+'%';}
  else if(k==='swq'){swq=t.value;var sl=$('sw-list');if(sl)sl.innerHTML=swRows();}
  else if(k.indexOf('bd-')===0)bd[k.slice(3)]=t.value;
  else if(k==='dr-name'&&draft)draft.name=t.value.slice(0,30);
  else if(k==='dr-muscle'&&draft)draft.muscle=t.value.slice(0,40);
  else if(k==='dr-desc'&&draft)draft.desc=t.value.slice(0,1500);
});
function readPhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){var m=600,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72));};
    im.onerror=function(){toast('사진을 읽을 수 없어');};im.src=fr.result;};
  fr.onerror=function(){toast('사진을 읽을 수 없어');};fr.readAsDataURL(file);
}

/* ---------- 운동 시작 전 계획 / 진행 ---------- */
var Q=null;
function pRow(i,k,label,unit,v){return (k==='work'||k==='rest')?tRow(k,label,v,'pstep','data-i="'+i+'"','p'+i):stepRow(k,label,unit,k_fmt(v),'pstep','data-i="'+i+'"');}

  var rows=it.type==='weight'?pRow(i,'kg','무게','kg',it.kg)+pRow(i,'reps','횟수','회',it.reps)+pRow(i,'sets','세트','세트',it.sets)+pRow(i,'rest','휴식','초',it.rest)

function planTotal(){var n=0;Q.items.forEach(function(it){n+=it.sets;});return '총 '+n+'세트';}
function paintPlan(){
  var el=$('ro-plan'),top=el.scrollTop;
  el.innerHTML='<header class="top brand">'+mas('roar',67)+'<div class="bt"><h1>오늘 운동</h1></div><span class="chip" id="pl-total">'+planTotal()+'</span></header>'+
    '<p class="hint">'+esc(Q.title)+' · 지난번 기록이 있으면 그 값으로 채웠어. 오늘 값으로 바꿔서 시작해.</p>'+

function setPlanVal(i,k,v){

function openSession(ids,title){
  var items=[];
  ids.forEach(function(id){var ex=getEx(id);if(!ex)return;var lp=lastPlan(ex);items.push(Object.assign({id:ex.id,name:ex.name,type:ex.type,log:[]},defPlan(ex),lp||{}));});
  if(!items.length){toast('운동이 비어 있어. 운동을 먼저 추가해줘');return;}
  Q={items:items,title:title||'운동',ph:'plan',ei:0,si:0,t0:0,paused:false,pauseAt:0,pausedMs:0,endAt:0,remain:0,dur:0,lastS:null,done:false,saved:false,entry:null,iv:0};

function showPane(n){
  $('ro-plan').hidden=n!=='plan';$('ro-run').hidden=n!=='run';$('ro-done').hidden=n!=='done';
  $('ro-swap').hidden=n!=='swap';

var swq='';
function pauseForSwap(){if(Q.ph!=='set'&&!Q.paused){Q.remain=Math.max(0,Q.endAt-Date.now());Q.paused=true;Q.pauseAt=Date.now();Q.swapP=true;}}
function resumeFromSwap(){if(Q.swapP){Q.swapP=false;Q.paused=false;Q.pausedMs+=Date.now()-Q.pauseAt;Q.endAt=Date.now()+Q.remain;}}
function swRows(){
  var inS={};Q.items.forEach(function(it){inS[it.id]=1;});var q=swq.trim().toLowerCase();
  var list=allEx().filter(function(e){return !inS[e.id]&&(!q||(e.name+' '+(e.muscle||'')).toLowerCase().indexOf(q)>=0);});

function paintSwap(){
  var el=$('ro-swap'),top=el.scrollTop,cur=Q.items[Q.ei];
  var rest=Q.items.map(function(it,i){return {it:it,i:i};}).filter(function(x){return x.i!==Q.ei&&x.it.log.length<x.it.sets;});
  el.innerHTML='<button class="back" data-act="swback">← 돌아가기</button><header class="top brand">'+mas('what',67)+'<div class="bt"><h1>운동 바꾸기</h1><small>기구가 사용 중이면 다른 운동부터!</small></div></header>'+
    '<p class="hint">'+(cur.log.length<cur.sets?'지금 하던 '+esc(cur.name)+'은(는) 고른 운동 바로 다음에 이어서 할 수 있어. 한 세트 한 기록은 그대로 남아.':'')+'</p>'+
    '<section class="card"><h2>이 루틴의 남은 운동</h2>'+(rest.length?'<ul class="list">'+rest.map(function(x){var ex=getEx(x.it.id)||x.it;return '<li class="xrow2">'+thumb(ex)+'<span class="xt"><b>'+esc(x.it.name)+'</b><small>남은 '+(x.it.sets-x.it.log.length)+'세트 · '+esc(targetTxt(x.it))+'</small></span><button class="mini pri" data-act="swgo" data-i="'+x.i+'">지금 하기</button></li>';}).join('')+'</ul>':'<p class="empty">남은 운동이 없어. 아래에서 다른 운동을 추가해봐.</p>')+'</section>'+
    '<section class="card"><h2>다른 운동 추가해서 하기</h2><input type="search" id="sw-q" data-in="swq" placeholder="운동 이름·부위 검색" value="'+esc(swq)+'"><ul class="list" id="sw-list">'+swRows()+'</ul></section>';
  el.scrollTop=top;
}
function switchTo(ch,isNew){
  var cur=Q.items[Q.ei],curDone=cur.log.length>=cur.sets;
  if(Q.paused){Q.paused=false;Q.pausedMs+=Date.now()-Q.pauseAt;}Q.swapP=false;
  if(!isNew){var ix=Q.items.indexOf(ch);if(ix>=0)Q.items.splice(ix,1);}
  var ci=Q.items.indexOf(cur);Q.items.splice(curDone?ci+1:ci,0,ch);Q.ei=Q.items.indexOf(ch);
  showPane('run');enterExercise();
}
function startCount(sec){Q.endAt=Date.now()+sec*1000;Q.dur=sec;Q.lastS=null;}
function unpause(){if(Q.paused){Q.paused=false;Q.pausedMs+=Date.now()-Q.pauseAt;}}
function remainMs(){return Q.paused?Q.remain:Math.max(0,Q.endAt-Date.now());}
function beginSession(){
  Q.items=Q.items.filter(function(it){return it.sets>=1;});
  if(!Q.items.length){toast('운동이 하나도 없어');return;}
  unlockAudio();wake(true);kaStart();
  Q.t0=Date.now();Q.ei=0;Q.si=0;showPane('run');
  if(S.settings.prep>0){Q.ph='prep';startCount(S.settings.prep);speak('준비');paintRun();}
  else enterExercise();
  Q.iv=setInterval(tick,200);
}
function enterExercise(){
  var it=Q.items[Q.ei];Q.si=it.log.length;
  if(it.type==='weight'){Q.ph='set';speak(it.name+', '+(it.kg>0?fmtKg(it.kg)+'킬로 ':'')+it.reps+'회');}
  else{Q.ph='work';startCount(it.work);speak(it.name);}
  beep(1100,0.3);buzz(200);paintRun();
}
function afterSet(){
  var it=Q.items[Q.ei],lastSet=Q.si>=it.sets-1,lastItem=Q.ei>=Q.items.length-1;
  if(lastSet&&lastItem){finishWorkout(true);return;}
  if(lastSet){advance();return;}
  if(it.rest>0){Q.ph='rest';startCount(it.rest);speak('휴식');beep(900,0.25);buzz(120);paintRun();}
  else advance();
}
function advance(){
  var it=Q.items[Q.ei];
  if(Q.si<it.sets-1){
    Q.si++;
    if(it.type==='weight')Q.ph='set';else{Q.ph='work';startCount(it.work);}
    beep(1100,0.3);buzz(200);paintRun();
  }else{Q.ei++;if(Q.ei>=Q.items.length){finishWorkout(true);return;}enterExercise();}
}
function phaseDone(){
  var it=Q.items[Q.ei];
  if(Q.ph==='prep')enterExercise();
  else if(Q.ph==='work'){it.log.push({sec:it.work});afterSet();}
  else if(Q.ph==='rest')advance();
}
function tick(){
  if(!Q||Q.done||Q.paused)return;
  if(Q.ph!=='prep'&&Q.ph!=='work'&&Q.ph!=='rest')return;
  var rem=Q.endAt-Date.now(),s=Math.ceil(rem/1000);
  if(s!==Q.lastS){Q.lastS=s;if(s>0&&s<=3){beep(880,0.18);buzz(60);}}
  if(rem<=0){phaseDone();return;}
  paintTick();
}
function doneSets(){var n=0;Q.items.forEach(function(it){n+=it.log.length;});return n;}
function totalSets(){var n=0;Q.items.forEach(function(it){n+=it.sets;});return n;}
function paintTick(){
  if(!Q||Q.done||Q.ph==='plan')return;mediaUpdate();
  var tb=$('ro-tbar');if(tb)tb.style.width=clamp(doneSets()/totalSets()*100,0,100)+'%';
  if(Q.ph==='set'){$('ro-bar').style.width='0%';return;}
  var rem=remainMs();
  $('ro-num').textContent=fmtBig(Math.ceil(rem/1000));
  $('ro-bar').style.width=clamp((1-rem/(Q.dur*1000))*100,0,100)+'%';
}
function nextTarget(){
  var it=Q.items[Q.ei];
  if(Q.si<it.sets-1)return '다음 · 세트 '+(Q.si+2)+'/'+it.sets+' · '+targetTxt(it);
  var nx=Q.items[Q.ei+1];return nx?'다음 운동 · '+nx.name+' · '+targetTxt(nx):'';
}
function paintRun(){
  if(!Q||Q.done||Q.ph==='plan'||!$('ro-swap').hidden)return;
  var it=Q.items[Q.ei],ph=Q.ph,ro=$('ro');
  ro.dataset.ph=ph==='set'?'work':ph;
  var figIt=(ph==='rest'&&Q.si>=it.sets-1&&Q.items[Q.ei+1])?Q.items[Q.ei+1]:it;
  $('ro-fig').innerHTML=figHtml(getEx(figIt.id)||figIt);
  var rmas=$('ro-mas'),pg=ph==='prep'?'prep':ph==='rest'?'rest':(ph==='set'||ph==='work')?'work':null,rk=null;if(pg){var rid=pg+'|'+Q.ei+'|'+Q.si;if(Q.mid!==rid){Q.mid=rid;Q.mval=pickM(pg);}rk=Q.mval;}if(rk&&MAS[rk]){if(rmas.dataset.k!==rk){rmas.dataset.k=rk;rmas.src=MAS[rk];}rmas.hidden=false;}else rmas.hidden=true;
  $('ro-set').textContent=ph==='prep'?'곧 시작해':'운동 '+(Q.ei+1)+'/'+Q.items.length+' · 세트 '+(Q.si+1)+'/'+it.sets;
  $('ro-title').textContent=Q.title;
  var l=lastRec(it.id,it.type),lastLine=l?'지난번 '+shortDate(l.ts)+' · '+setsText(l.it):'첫 기록이야';
  var num=$('ro-num'),label=$('ro-label'),ex=$('ro-ex'),adj=$('ro-adj');
  num.classList.toggle('wt',ph==='set');
  if(ph==='prep'){label.textContent='준비';ex.textContent='첫 운동: '+it.name;adj.innerHTML='';}
  else if(ph==='rest'){label.textContent='휴식';ex.textContent=nextTarget();adj.innerHTML='<button class="adjb" data-act="trest">+15초</button>';}
  else if(ph==='work'){label.textContent=it.name;ex.textContent=lastLine;adj.innerHTML='';}
  else{
    label.textContent=it.name;ex.textContent=lastLine;
    num.innerHTML=(it.kg>0?fmtKg(it.kg)+'<small>kg</small>× ':'')+it.reps+'<small>회</small>';
    adj.innerHTML='<div class="adjrow"><span>무게</span><button class="adjb" data-act="qadj" data-k="kg" data-d="-1" aria-label="무게 줄이기">−</button><b>'+fmtKg(it.kg)+'</b><button class="adjb" data-act="qadj" data-k="kg" data-d="1" aria-label="무게 늘리기">+</button></div>'+
      '<div class="adjrow"><span>횟수</span><button class="adjb" data-act="qadj" data-k="reps" data-d="-1" aria-label="횟수 줄이기">−</button><b>'+it.reps+'</b><button class="adjb" data-act="qadj" data-k="reps" data-d="1" aria-label="횟수 늘리기">+</button></div>';
  }
  var nl='';
  if(ph==='set'||ph==='work'){
    var lastSet=Q.si>=it.sets-1,nx=Q.items[Q.ei+1];
    nl=!lastSet?(it.rest>0?'다음 · 휴식 '+fmtLong(it.rest):'다음 · 세트 '+(Q.si+2)):(nx?'다음 운동 · '+nx.name:'마지막 세트야!');
  }
  $('ro-next').textContent=nl;
  $('ro-main').textContent=ph==='set'?'세트 완료':(Q.paused?'계속':'일시정지');
  $('ro-skip').textContent=ph==='set'?'운동 건너뛰기':ph==='rest'?'휴식 건너뛰기':'건너뛰기';
  $('ro-stop').textContent=armed==='tstop'?'정말 종료?':'종료';
  paintTick();
}
function finishWorkout(auto){
  clearInterval(Q.iv);kaStop();
  var now=Date.now(),secs=Math.round((now-Q.t0-Q.pausedMs-(Q.paused?now-Q.pauseAt:0))/1000);
  if(!auto&&(Q.ph==='work')){var it=Q.items[Q.ei],part=Math.round(it.work-remainMs()/1000);if(part>=5)it.log.push({sec:part});}
  var items=Q.items.filter(function(i){return i.log.length;}).map(function(i){return {id:i.id,name:i.name,type:i.type,rest:i.rest,sets:i.log.map(function(s){return Object.assign({},s);})};});
  Q.done=true;
  var entry=items.length?{id:uid(),ts:Q.t0,type:'workout',name:Q.title,seconds:Math.max(1,secs),items:items}:null;
  Q.entry=entry;
  var prev={},prs={},prN=0;if(entry)items.forEach(function(i){prev[i.id]=lastRec(i.id,i.type);var kv=itKV(i),pb=kv?prevBest(i.id,kv.kind):null;if(kv&&pb!=null&&kv.v>pb){prs[i.id]=true;prN++;}});
  if(entry){S.history.unshift(entry);S.history.sort(function(a,b){return b.ts-a.ts;});S.history=S.history.slice(0,1000);save();Q.saved=true;if(!auto)setTimeout(function(){toast('여기까지 기록했어');},300);}
  if(auto){speak('완료! 수고했어');beep(1400,0.5);buzz([200,100,200,100,400]);}
  showPane('done');
  $('d-mas').src=MAS[!entry?'cry':pickM('done')];
  $('d-title').textContent=!entry?'기록할 게 없어':(prN?'🏆 신기록!':(auto?'완료!':'여기까지'));
  $('d-time').textContent=entry?fmtClock(entry.seconds):'';
  var ns=0,vol=0;items.forEach(function(i){ns+=i.sets.length;vol+=volOf(i);});
  $('d-sub').textContent=entry?'운동 '+items.length+'개 · '+ns+'세트'+(prN?' · 신기록 '+prN+'개':''):'';
  $('d-list').innerHTML=items.map(function(i){
    var tag='',p=prev[i.id];
    if(p){
      if(i.type==='weight'){var a=Math.max.apply(null,i.sets.map(function(s){return s.kg;})),b=Math.max.apply(null,p.it.sets.map(function(s){return s.kg;}));tag=a>b?' · 최대 중량 ▲ +'+fmtKg(a-b)+'kg':a<b?' · 최대 중량 ▼ '+fmtKg(a-b)+'kg':'';}
      else{var x=0,y=0;i.sets.forEach(function(s){x+=s.sec;});p.it.sets.forEach(function(s){y+=s.sec;});tag=x>y?' · 총 시간 ▲ +'+fmtLong(x-y):x<y?' · 총 시간 ▼ −'+fmtLong(y-x):'';}
    }
    return '<li><b>'+esc(i.name)+'</b><small>'+esc(setsText(i))+esc(tag)+(prs[i.id]?' · 🏆 신기록!':'')+'</small></li>';
  }).join('');
  $('d-eff-wrap').hidden=!entry;$('d-share').hidden=!entry;
  $('d-eff').innerHTML=['쉬움','보통','힘듦'].map(function(n,i){return '<button class="ob" data-act="eff" data-v="'+(i+1)+'" aria-pressed="false">'+n+'</button>';}).join('');
  $('d-cal').hidden=!entry;if(entry)$('d-cal').href=calHref(entry);
  $('d-save').hidden=!entry||Q.saved;
}
function closeSession(){
  if(Q&&Q.iv)clearInterval(Q.iv);
  kaStop();Q=null;cal=null;$('ro').hidden=true;wake(false);render();
}

/* ---------- 버튼 동작 ---------- */
function newDraft(){return {name:'',cat:'anaerobic',type:'weight',muscle:'',desc:''};}
function saveRoutineDraft(){
  var d=rdraft,n=d.name.trim();
  if(!n){toast('루틴 이름을 먼저 적어줘');var i=$('in-rname');if(i)i.focus();return false;}
  var items=d.items.filter(function(id){return getEx(id);});
  var now=Date.now();
  if(d.id){var r=S.routines.filter(function(x){return x.id===d.id;})[0];
    if(r){var old=r.items,sn=r.since||{};

var lastBack=0,exiting=false;
function hIdx(){try{return (history.state&&history.state.wt)||0;}catch(e){return 0;}}
function fillGuard(){try{var g=0;while(hIdx()<3&&g++<5)history.pushState({wt:hIdx()+1},'');}catch(e){}}
try{history.replaceState({wt:0},'');}catch(e){}
document.addEventListener('pointerdown',function(){if(!exiting)fillGuard();},true);
window.addEventListener('popstate',function(){
  if(exiting)return;
  var q=$('exitq');
  if(!q.hidden){q.hidden=true;fillGuard();return;}
  if(appBack()){fillGuard();return;}
  var now=Date.now();
  if(now-lastBack<2300){lastBack=0;q.hidden=false;fillGuard();return;}
  lastBack=now;toast('한 번 더 누르면 종료 확인창이 떠');fillGuard();
});
function doExit(){
  exiting=true;$('exitq').hidden=true;
  try{history.go(-(hIdx()+1));}catch(e){}
  setTimeout(function(){exiting=false;toast('여기선 앱을 직접 닫을 수 없어. 홈 버튼이나 앱 전환으로 나가줘');},700);
}

  drag.to=to;

    if(drag.from<to&&k>drag.from&&k<=to)sh=-drag.h;else if(drag.from>to&&k<drag.from&&k>=to)sh=drag.h;
    el.style.transform=sh?'translateY('+sh+'px)':'';});
});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  var d=drag;drag=null;
  d.els.forEach(function(el){el.style.transform='';el.style.transition='';el.classList.remove('drag');});
  if(d.to!==d.from&&rdraft){var it=rdraft.items.splice(d.from,1)[0];rdraft.items.splice(d.to,0,it);render();}
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',function(e){
  var h=e.target.closest&&e.target.closest('.dh');if(!h||!rdraft)return;
  var i=+h.dataset.i,d=e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0;if(!d)return;

  var nh=document.querySelector('.dh[data-i="'+j+'"]');if(nh)nh.focus();
});

/* ---------- 좌우로 밀어서 탭 이동 ---------- */
(function(){
  var ORDER=['routines','exercises','home','history','settings'],sx=0,sy=0,st=0,ok=false,m=$('main');
  function xScroll(el){
    while(el&&el!==m&&el.nodeType===1){
      if(el.scrollWidth>el.clientWidth+4){var o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return true;}
      el=el.parentNode;
    }
    return false;
  }
  m.addEventListener('touchstart',function(e){
    ok=false;if(e.touches.length!==1||nav.sub||Q||!$('shq').hidden||!$('heq').hidden||!$('bkq').hidden||!$('exitq').hidden||$('splash'))return;
    var t=e.target;if(t.closest&&t.closest('input,textarea,select,[data-noswipe],.dh'))return;if(xScroll(t))return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();ok=true;
  },{passive:true});
  m.addEventListener('touchend',function(e){
    if(!ok)return;ok=false;var c=e.changedTouches[0],dx=c.clientX-sx,dy=c.clientY-sy;
    if(Date.now()-st>800||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
    var i=ORDER.indexOf(nav.tab),j=i+(dx<0?1:-1);if(i<0||j<0||j>=ORDER.length)return;
    acts.tab({dataset:{t:ORDER[j]}});
    var v=$('view');v.classList.remove('vl','vr');void v.offsetWidth;v.classList.add(dx<0?'vl':'vr');
    setTimeout(function(){v.classList.remove('vl','vr');},260);
  },{passive:true});
})();
